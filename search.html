<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search - Amboseli HR</title>
    <meta name="description" content="Search across Amboseli HR." />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Search Specific Styles */
      body {
        background-color: var(--bg-primary);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .navbar {
        background: rgba(5, 5, 5, 0.8) !important;
        border-bottom: 1px solid var(--border-color) !important;
        box-shadow: none !important;
      }

      .search-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 5%;
        position: relative;
      }

      .search-wrapper {
        width: 100%;
        max-width: 800px;
        position: relative;
        z-index: 10;
      }

      .search-title {
        font-size: 2.5rem;
        margin-bottom: 40px;
        text-align: center;
        font-weight: 300;
        letter-spacing: 1px;
      }

      .search-input-group {
        position: relative;
        display: flex;
        align-items: center;
        background: rgba(20, 20, 20, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid var(--primary);
        border-radius: 50px;
        padding: 10px 30px;
        box-shadow: var(--glow-shadow-strong);
        transition: var(--transition);
      }

      .search-input-group:focus-within {
        background: rgba(30, 30, 30, 0.9);
        box-shadow: 0 0 40px rgba(255, 138, 43, 0.5);
        transform: scale(1.02);
      }

      .search-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-white);
        font-size: 1.5rem;
        padding: 15px 10px;
        font-family: var(--font-main);
      }

      .search-input:focus {
        outline: none;
      }

      .search-input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      .search-btn {
        background: transparent;
        border: none;
        color: var(--primary);
        font-size: 1.8rem;
        cursor: pointer;
        transition: var(--transition);
        padding: 10px;
      }

      .search-btn:hover {
        color: var(--primary-glow);
        transform: scale(1.1);
      }

      .category-filters {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 40px;
        flex-wrap: wrap;
      }

      .filter-tag {
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        color: var(--text-muted);
        cursor: pointer;
        transition: var(--transition);
        font-size: 0.9rem;
      }

      .filter-tag:hover,
      .filter-tag.active {
        background: rgba(255, 138, 43, 0.15);
        border-color: var(--primary);
        color: var(--text-white);
        box-shadow: var(--glow-shadow);
      }

      .search-suggestions {
        margin-top: 30px;
        text-align: center;
      }

      .search-suggestions span {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-right: 10px;
      }

      .search-suggestions a {
        color: var(--primary);
        margin: 0 10px;
        font-size: 0.95rem;
      }

      .search-suggestions a:hover {
        text-decoration: underline;
      }

      .close-search {
        position: absolute;
        top: 120px;
        right: 5%;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: var(--text-white);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
        cursor: pointer;
        transition: var(--transition);
        z-index: 100;
      }

      .close-search:hover {
        background: var(--primary);
        border-color: var(--primary);
        box-shadow: var(--glow-shadow);
        transform: rotate(90deg);
      }

      @media (max-width: 768px) {
        .search-title {
          font-size: 1.8rem;
        }
        .search-input {
          font-size: 1.2rem;
        }
        .close-search {
          top: 100px;
          width: 40px;
          height: 40px;
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
        <!-- Navbar -->
    <nav class="navbar fade-in-up">
      <a href="index.html" class="nav-brand">
        <img src="images/logo-2.png" alt="Logo" class="logo-img" />
      </a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="employers.html">Employers</a>
        <a href="candidates.html">Candidates</a>
        <a href="about.html#services">Services</a>
        <a href="contact.html">Contact Us</a>
        <a href="search.html" class="search-icon"><i class="fas fa-search"></i></a>
      </div>

      <div class="mobile-menu-btn">
        <i class="fas fa-bars"></i>
      </div>
    </nav>

    <a href="index.html" class="close-search fade-in-right"
      ><i class="fas fa-times"></i
    ></a>

    <!-- Search Container -->
    <div class="search-container">
      <div
        class="glow-bg"
        style="
          width: 1000px;
          height: 1000px;
          opacity: 0.6;
          animation: pulse 4s infinite;
        "
      ></div>

      <div class="search-wrapper fade-in-up">
        <h1 class="search-title">
          Search across
          <span class="text-primary" style="font-weight: 600"
            >Amboseli HR...</span
          >
        </h1>

        <div class="search-input-group">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Type here to search..."
            autocomplete="off"
            autofocus
          />
          <button class="search-btn"><i class="fas fa-search"></i></button>
        </div>

        <div class="category-filters stagger-1">
          <div class="filter-tag active">All</div>
          <div class="filter-tag">Jobs</div>
          <div class="filter-tag">Employers</div>
          <div class="filter-tag">Services</div>
          <div class="filter-tag">Resources</div>
        </div>

        <div class="search-suggestions stagger-2">
          <span>Popular searches:</span>
          <a href="#">IT Recruitment</a>
          <a href="#">Executive Search</a>
          <a href="#">Consulting</a>
        </div>
      </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/search.js"></script>
  </body>
</html>
